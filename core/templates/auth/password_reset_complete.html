<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Successful — WatchOut</title>
    <style>
        :root {
            --bg: #0b0b0f;
            --card: #14141a;
            --card2: #1c1c24;
            --accent: #ff1e3c;
            --accent-soft: #ff4d6d;
            --text: #f1f1f1;
            --sub: #9ca3af;
            --border: rgba(255, 255, 255, 0.07);
            --border2: rgba(255, 255, 255, 0.12);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        body::before {
            content: "";
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 30, 60, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-decoration: none;
            color: var(--text);
            margin-bottom: 36px;
            position: relative;
            z-index: 1;
        }

        .logo span {
            color: var(--accent);
        }

        .card {
            background: var(--card);
            border: 0.5px solid var(--border2);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        .icon-wrap {
            width: 64px;
            height: 64px;
            background: rgba(255, 30, 60, 0.1);
            border: 1px solid rgba(255, 30, 60, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--accent);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 13px;
            color: var(--sub);
            line-height: 1.7;
            text-align: center;
            margin-bottom: 28px;
        }

        .divider {
            width: 36px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
            margin: 0 auto 24px;
            opacity: 0.5;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            background: var(--card2);
            border: 0.5px solid var(--border2);
            border-radius: 9px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: rgba(255, 30, 60, 0.55);
            box-shadow: 0 0 0 3px rgba(255, 30, 60, 0.1);
        }

        .form-group input::placeholder {
            color: #4b5563;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px 24px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.15s, transform 0.15s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            opacity: 0.88;
            transform: translateY(-2px);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 100%;
            padding: 12px 24px;
            background: transparent;
            border: 0.5px solid var(--border2);
            border-radius: 10px;
            color: var(--sub);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: var(--card2);
            color: var(--text);
        }

        .error-list {
            background: rgba(255, 30, 60, 0.08);
            border: 0.5px solid rgba(255, 30, 60, 0.3);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 18px;
        }

        .error-list ul {
            list-style: none;
        }

        .error-list li {
            font-size: 13px;
            color: #ff7a8a;
            display: flex;
            align-items: flex-start;
            gap: 7px;
            line-height: 1.5;
            padding: 2px 0;
        }

        .error-list li::before {
            content: "✕";
            flex-shrink: 0;
            margin-top: 1px;
        }

        .footer-note {
            margin-top: 18px;
            font-size: 12px;
            color: #4b5563;
            text-align: center;
        }

        .page-footer {
            margin-top: 32px;
            font-size: 12px;
            color: #374151;
            position: relative;
            z-index: 1;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 0.5px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 13px;
            color: var(--sub);
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <a class="logo" href="/">Watch<span>Out</span></a>

    <div class="card">

        <div class="icon-wrap">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
        </div>

        <div class="card-title">Password Reset Successful</div>
        <div class="divider"></div>
        <div class="card-desc">
            Your password has been successfully changed.<br>
            You can now log in with your new password.
        </div>

        <a href="{% url 'viewer_login' %}" class="btn-primary">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                <polyline points="10 17 15 12 10 7" />
                <line x1="15" y1="12" x2="3" y2="12" />
            </svg>
            Login Now
        </a>

        <div class="footer-note">Keep your new password safe and don't share it with anyone.</div>

    </div>

    <div class="page-footer">&copy; 2026 WatchOut. All rights reserved.</div>

</body>

</html>
