<h2>Set New Password</h2>


<form method="post">
    {{ form.errors }}
    {% csrf_token %}

    <div>
        <label>New Password</label>
        {{ form.new_password1 }}
    </div>

    <div>
        <label>Confirm Password</label>
        {{ form.new_password2 }}
    </div>

    <button type="submit">Reset Password</button>
</form>
