{% extends 'base_user/base_user.html' %}
{% block content %}

{% if series %}
    <h2>Featured Series</h2>
    <div class="series-list">
        {% for s in series %}
            <div class="series-item">
                <a href="{% url 'detail_film_guest' s.series_id %}">
                    {% if s.thumbnail_picture %}
                        <img src="{{ s.thumbnail_picture.url }}" alt="{{ s.title }} Poster" class="series-poster">
                    {% else %}
                        <img src="/static/img/placeholder.png" alt="No image" class="series-poster">
                    {% endif %}
                    <h3>{{ s.title }}</h3>
                </a>
            </div>
        {% endfor %}
        
    </div>
{% else %}
    <p>No series available at the moment. Please check back later!</p>
{% endif %}

{% endblock %}
