{% extends 'base_user/base_user.html' %}
{% block content %}

<style>

/* CONTAINER */
.watch-container{
    display:flex;
    gap:30px;
    padding:30px;
}

/* LEFT PLAYER */
.player-section{
    flex:3;
}

/* PLAYER */
#yt-player iframe{
    width:100%;
    height:500px;
    border-radius:10px;
}

/* TITLE */
.video-title{
    font-size:22px;
    margin:15px 0;
}

/* RIGHT SIDEBAR */
.episode-sidebar{
    flex:1;
    max-height:600px;
    overflow-y:auto;
    background:#1c1c1c;
    border-radius:10px;
    padding:15px;
}

/* EPISODE BUTTON */
.ep-btn{
    width:100%;
    padding:10px;
    margin-bottom:8px;
    border:none;
    border-radius:6px;
    background:#2a2a2a;
    color:white;
    text-align:left;
    cursor:pointer;
    transition:0.2s;
}

.ep-btn:hover{
    background:#ff2c2c;
}

/* COMMENT */
.comment-section{
    padding:30px;
}

/* TEXTAREA */
textarea{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    background:#1c1c1c;
    color:white;
    margin-bottom:10px;
}

/* BUTTON */
.comment-btn{
    padding:10px 20px;
    border:none;
    border-radius:6px;
    background:#ff2c2c;
    color:white;
    cursor:pointer;
}

/* COMMENT LIST */
#comments-list ul{
    list-style:none;
    padding:0;
}

#comments-list li{
    padding:10px;
    border-bottom:1px solid #333;
}

/* RESPONSIVE */
@media(max-width:768px){
    .watch-container{
        flex-direction:column;
    }

    #yt-player iframe{
        height:250px;
    }
}

</style>


{% if series %}

<div class="watch-container">

    <!-- PLAYER -->
    <div class="player-section">

        <div id="yt-player"></div>

        <div class="video-title">
            {{ series.title }}
        </div>

        <a id="open-on-youtube" href="https://www.youtube.com/watch?v={{ episode.video_id }}" target="_blank">
            Watch on YouTube
        </a>

    </div>

    <!-- EPISODE LIST -->
    <div class="episode-sidebar">

        <h3>Episodes</h3>

        {% for ep in series.episode_set.all %}
            <button class="ep-btn"
                data-ep-id="{{ ep.episode_id }}"
                data-video-id="{{ ep.video_id }}"
                data-ep-number="{{ ep.episode_number }}"
                data-ep-title="{{ ep.episode_title }}">
                Episode {{ ep.episode_number }}
            </button>
        {% endfor %}

    </div>

</div>

<!-- COMMENT -->
<div class="comment-section">

    <h3>Comments</h3>

    <form method="post" action="{% url 'viewer_comment' series.series_id episode.episode_id %}">
        {% csrf_token %}
        <textarea name="content" placeholder="Write your comment..."></textarea>
        <button type="submit" class="comment-btn">Post</button>
    </form>

    <div id="comments-list"></div>

</div>

{% endif %}

<!-- JS KAMU (TETAP) -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
/* SEMUA SCRIPT KAMU TETAP DI SINI, TIDAK DIUBAH */
</script>

{% endblock %}
