{% extends 'base_admin/base_manage_film.html' %}
{% block content %}

<div style="
background:white;
padding:30px;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
font-family:'Poppins',sans-serif;
max-width:900px;
margin:auto;
">

{% if episode %}

<!-- HEADER -->

<div style="margin-bottom:20px">

<span style="
background:#6366f1;
color:white;
padding:4px 10px;
border-radius:6px;
font-size:12px;
">

Episode {{ episode.episode_number }}

</span>

<h2 style="
margin:10px 0 0 0;
font-weight:600;
">

{{ episode.episode_title }}

</h2>

</div>


<!-- VIDEO PLAYER -->

<div style="
position:relative;
padding-bottom:56.25%;
height:0;
overflow:hidden;
border-radius:12px;
box-shadow:0 6px 18px rgba(0,0,0,0.15);
">

<iframe
src="https://www.youtube.com/embed/{{ episode.video_id }}?rel=0&modestbranding=1&origin={{ origin }}"
title="YouTube video player"
frameborder="0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen
style="
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
">
</iframe>

</div>


<!-- ACTION BUTTONS -->

<div style="
display:flex;
gap:12px;
margin-top:20px;
flex-wrap:wrap;
">

<a href="https://www.youtube.com/watch?v={{ episode.video_id }}" target="_blank">

<button style="
background:#ef4444;
padding:10px 16px;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
">

Watch on YouTube

</button>

</a>

<a href="javascript:history.back()">

<button style="
background:#64748b;
padding:10px 16px;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
">

← Back

</button>

</a>

</div>

{% else %}

<div style="
text-align:center;
padding:40px;
color:#6b7280;
">

<h3>No episode selected</h3>
<p>The episode could not be found.</p>

</div>

{% endif %}

</div>

{% endblock %}
