<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anime Streaming Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* GLOBAL */

body{
margin:0;
font-family:'Poppins', sans-serif;
color:#1e293b;
background:#f1f5f9;
}

/* HEADER */

.header{
height:70px;
background:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 40px;
box-shadow:0 4px 20px rgba(0,0,0,0.05);
}

/* LOGO */

.logo{
font-size:20px;
font-weight:600;
color:#4f46e5;
text-decoration:none;
transition:0.2s;
}

.logo:hover{
opacity:0.8;
transform:scale(1.05);
}

/* NAV */

.nav a{
text-decoration:none;
color:#64748b;
margin-left:25px;
font-weight:500;
transition:.2s;
}

.nav a:hover{
color:#4f46e5;
}

/* CONTENT */

.content{
padding:40px;
animation:fadeIn 0.4s ease;
}

/* CARD */

.card{
background:white;
padding:25px;
border-radius:14px;
margin-bottom:25px;
box-shadow:0 8px 25px rgba(0,0,0,0.06);
border:1px solid #e2e8f0;
transition:.25s;
}

.card:hover{
transform:translateY(-4px);
}

/* BUTTON */

button{
background:linear-gradient(135deg,#6366f1,#4f46e5);
border:none;
padding:10px 18px;
border-radius:8px;
color:white;
cursor:pointer;
font-weight:500;
transition:.2s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(79,70,229,0.3);
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

table th{
background:#4f46e5;
color:white;
padding:12px;
text-align:left;
}

table td{
padding:12px;
border-bottom:1px solid #e2e8f0;
}

table tr:hover{
background:#f8fafc;
}

/* INPUT */

input,select,textarea{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #cbd5f5;
background:white;
margin-bottom:10px;
}

input:focus{
outline:none;
border-color:#6366f1;
box-shadow:0 0 0 2px rgba(99,102,241,0.2);
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,200px);
gap:25px;
}

/* POSTER */

.poster{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
transition:.25s;
}

.poster:hover{
transform:scale(1.05);
}

.poster img{
width:100%;
height:280px;
object-fit:cover;
}

.poster h4{
padding:10px;
margin:0;
font-size:14px;
}

/* FADE */

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

<a href="{% url 'admin_homepage' %}" class="logo">
🎌 Anime Admin
</a>

<div class="nav">

<a href="{% url 'admin_homepage' %}">Dashboard</a>
<a href="{% url 'manage_film' %}">Anime</a>
<a href="{% url 'manage_genre' %}">Genres</a>
<a href="{% url 'manage_producer' %}">Producers</a>
<a href="{% url 'manage_studio' %}">Studios</a>

</div>

</div>

<!-- CONTENT -->

<div class="content">

{% block content %}
{% endblock %}

</div>

</body>
</html>
