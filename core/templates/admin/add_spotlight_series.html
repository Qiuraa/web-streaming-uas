{% extends 'base_admin/base_admin.html' %}
{% block content %}

<form method="post" id="add-spotlight-form" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-group">
        <label for="id_series_search">Search series</label>
        <input type="text" id="id_series_search" name="series_search" class="form-control" placeholder="Type a series title...">
        <div id="series-suggestions" class="suggestions" style="border:1px solid #ccc; display:none; position:relative; background:#fff; max-height:200px; overflow:auto;"></div>
    </div>

    {{ add_spotlight_form.series_id }} {# hidden input rendered by the form #}

    <div class="form-group">
        <label for="id_image">Spotlight image (landscape)</label>
        <input type="file" id="id_image" name="image" accept="image/*" class="form-control" />
        <small class="form-text text-muted">Recommended: landscape image wide enough to span the spotlight row.</small>
    </div>

    <button type="submit" class="btn btn-primary">Add Spotlight Series</button>
</form>

<script>
// Client-side small search+dropdown for published_series
(function(){
    const published = {{ published_series_json|safe }};
    const input = document.getElementById('id_series_search');
    const suggestions = document.getElementById('series-suggestions');
    const hiddenField = document.getElementById('id_series_id');

    function showSuggestions(list){
        suggestions.innerHTML = '';
        if(!list.length){ suggestions.style.display = 'none'; return; }
        list.forEach(item => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.style.padding = '6px';
            div.style.cursor = 'pointer';
            div.textContent = item.title;
            div.dataset.id = item.series_id;
            div.addEventListener('click', function(){
                input.value = this.textContent;
                if(hiddenField) hiddenField.value = this.dataset.id;
                suggestions.style.display = 'none';
            });
            suggestions.appendChild(div);
        });
        suggestions.style.display = 'block';
    }

    input.addEventListener('input', function(){
        const q = this.value.trim().toLowerCase();
        if(!q){ suggestions.style.display = 'none'; return; }
        const filtered = published.filter(p => p.title.toLowerCase().includes(q));
        showSuggestions(filtered.slice(0,50));
    });

    // hide on click outside
    document.addEventListener('click', function(e){
        if(!document.getElementById('add-spotlight-form').contains(e.target)){
            suggestions.style.display = 'none';
        }
    });

    // ensure hidden field cleared if user edits after selecting
    input.addEventListener('change', function(){ if(hiddenField && hiddenField.value && hiddenField.value.length>0){ /* keep */ } });
})();
</script>

{% endblock %}
