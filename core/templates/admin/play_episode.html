{% extends 'base_admin/base_manage_film.html' %}
{% block content %}

{% if episode %}
    <h3>Playing: Episode {{ episode.episode_number }} — {{ episode.title }}</h3>
    <iframe width="560" height="315"
        src="https://www.youtube.com/embed/{{ episode.video_id }}?rel=0&modestbranding=1&origin={{ origin }}"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>

    <p><a href="https://www.youtube.com/watch?v={{ episode.video_id }}" target="_blank">Open on YouTube</a></p>
{% else %}
    <p>No episode selected or episode not found.</p>
{% endif %}

{% endblock %}
