{% extends 'base_admin/base_admin.html' %}
{% block content %}

<div style="
max-width:900px;
margin:auto;
background:white;
padding:35px;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
font-family:'Poppins',sans-serif;
">

<!-- HEADER -->

<div style="margin-bottom:25px">

<h2 style="
margin:0;
font-weight:600;
">

Add New Anime

</h2>

<p style="
margin-top:6px;
font-size:14px;
color:#6b7280;
">

Create a new anime entry in the library

</p>

</div>


<!-- FORM -->

<form method="post" enctype="multipart/form-data">

{% csrf_token %}

<div style="
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
">

{{ add_film_form.as_p }}

</div>


<!-- BUTTONS -->

<div style="
margin-top:25px;
display:flex;
gap:12px;
flex-wrap:wrap;
">

<button type="submit" style="
background:linear-gradient(135deg,#6366f1,#3b82f6);
padding:10px 20px;
border:none;
border-radius:8px;
color:white;
font-weight:500;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
">

Add Anime

</button>


<a href="{% url 'manage_film' %}">

<button type="button" style="
background:#64748b;
padding:10px 16px;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
">

Cancel

</button>

</a>

</div>

</form>

</div>

{% endblock %}
