<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>

body{
margin:0;
height:100vh;
font-family:Arial, sans-serif;
display:flex;
justify-content:center;
align-items:center;
background-image:url("static/img/login_bg.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

/* overlay supaya tulisan tetap jelas */
.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
}

/* login card */
.login-card{
position:relative;
background:white;
padding:40px;
width:360px;
border-radius:14px;
box-shadow:0 15px 35px rgba(0,0,0,0.3);
animation:fadeIn 1s ease;
}

/* floating animation */
@keyframes fadeIn{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* input style */
input{
width:100%;
padding:10px;
border-radius:6px;
border:1px solid #ddd;
margin-top:5px;
margin-bottom:15px;
font-size:14px;
}

/* button */
button{
width:100%;
padding:10px;
border:none;
border-radius:6px;
background:#5a4bff;
color:white;
font-size:15px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#4838e8;
}

h2{
text-align:center;
margin-top:0;
margin-bottom:25px;
}

.error{
background:#ffe5e5;
color:#d8000c;
padding:10px;
border-radius:6px;
margin-bottom:15px;
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="login-card">

<h2>🎬 Anime Admin Login</h2>

<form method="post">
{% csrf_token %}

{% if form.non_field_errors %}
<div class="error">
{{ form.non_field_errors }}
</div>
{% endif %}

<label>Username</label>
{{ form.username }}

<label>Password</label>
{{ form.password }}

{% if next %}
<input type="hidden" name="next" value="{{ next }}">
{% endif %}

<button type="submit">Login</button>

</form>

{% if messages %}
<ul style="margin-top:20px;padding:0;list-style:none;">
{% for message in messages %}
<li>{{ message }}</li>
{% endfor %}
</ul>
{% endif %}

</div>

</body>
</html>
