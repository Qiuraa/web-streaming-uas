{% extends 'base_admin/base_manage_film.html' %}
{% block content %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ edit_film_form.as_p }}
    <button type="submit">Save Changes</button>
</form>
<form method="post" action="{% url 'delete_film' series_id=edit_film_form.instance.series_id %}">
    {% csrf_token %}
    <button type="submit" onclick="return confirm('Are you sure you want to delete this film? This action cannot be undone.')">Delete Film</button>
</form>

{% endblock %}
