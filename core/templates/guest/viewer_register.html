 <!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

/* BODY */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("/media/img/login_bg.jpeg") center/cover no-repeat;
}

/* OVERLAY */
.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

/* CARD */
.signup-card{
    position:relative;
    z-index:2;
    width:380px;
    max-height:90vh;
    overflow-y:auto;
    padding:35px;
    border-radius:16px;
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    animation:fadeIn 0.8s ease;
    color:white;
}

/* TITLE */
.signup-card h2{
    text-align:center;
    margin-bottom:20px;
}

/* FORM INPUT DJANGO */
.signup-card input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    outline:none;
    margin-bottom:12px;
    background:rgba(255,255,255,0.1);
    color:white;
}

/* LABEL */
.signup-card label{
    font-size:13px;
    color:#ccc;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#ff2c2c;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

button:hover{
    background:#ff4444;
    transform:scale(1.02);
}

/* LINKS */
.links{
    margin-top:15px;
    text-align:center;
}

.links a{
    color:#ccc;
    text-decoration:none;
    font-size:14px;
}

.links a:hover{
    color:white;
}

/* ERROR */
.errorlist{
    color:#ffaaaa;
    font-size:12px;
    margin-bottom:5px;
}

/* ANIMATION */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="signup-card">

<h2>Create Account</h2>

<form method="post">
    {% csrf_token %}

    {{ viewer_register_form.as_p }}

    <button type="submit">Sign Up</button>
</form>

<div class="links">
    <p>Already have an account?</p>
    <a href="{% url 'viewer_login' %}">Sign In</a><br>
    <a href="{% url 'homepage' %}">← Back to Home</a>
</div>

</div>

</body>
</html>
