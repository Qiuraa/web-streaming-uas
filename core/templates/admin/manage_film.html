{% extends 'base_admin/base_manage_film.html' %}
{% block content %}

<a href="{% url 'add_film' %}"><h3>Add New Film</h3></a>
<a href="{% url 'manage_genre' %}"><h3>Manage Genre</h3></a>
<a href="{% url 'manage_producer' %}"><h3>Manage Producer</h3></a>
<a href="{% url 'manage_studio' %}"><h3>Manage Studio</h3></a>
<a href="{% url 'admin_homepage' %}"><h4>Back to Admin Homepage</h4></a>

{% for s in series %}
{% if s.thumbnail_picture %}
	<a href="{% url 'detail_film' s.series_id %}"><img src="{{ s.thumbnail_picture.url }}" alt="{{ s.title }}" width="200" height="300"></a>
{% else %}
	<!-- optional placeholder when no image is uploaded -->
	<img src="/static/img/placeholder.png" alt="No image" width="200" height="300">
{% endif %}
<h4><a href="{% url 'detail_film' s.series_id %}">{{ s.title }}</a></h4>
{% endfor %}
{% endblock %}
